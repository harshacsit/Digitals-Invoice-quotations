<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Bhimavaram Digitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/api.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-side">
    <div class="glow"></div>
    <div class="mark mb-4" style="width:46px;height:46px;">AD</div>
    <h2 style="color:#fff;font-size:28px;max-width:380px;">Quotations to invoices, without the spreadsheet chaos.</h2>
    <p style="color:#9AA1C4;max-width:360px;">Manage customers, billboard & TV screen inventory, quotations and payments from one place.</p>
    <div class="d-flex gap-4 mt-4">
      <div><div style="color:#fff;font-family:'Poppins',sans-serif;font-size:22px;font-weight:600;">318</div><div style="color:#9AA1C4;font-size:12px;">Customers</div></div>
      <div><div style="color:#fff;font-family:'Poppins',sans-serif;font-size:22px;font-weight:600;">78</div><div style="color:#9AA1C4;font-size:12px;">Screens</div></div>
      <div><div style="color:#fff;font-family:'Poppins',sans-serif;font-size:22px;font-weight:600;">₹18.4L</div><div style="color:#9AA1C4;font-size:12px;">This month</div></div>
    </div>
  </div>

  <div class="auth-form-side">
    <div style="width:100%;max-width:340px;padding:20px;">
      <h3 class="mb-1">Welcome back</h3>
      <p class="text-muted mb-4" style="font-size:13.5px;">Sign in to your AdsDash account</p>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="admin@adsdash.local" value="admin@adsdash.local" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" value="AdminPassword@123" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4" style="font-size:12.5px;">
          <label class="d-flex align-items-center gap-2"><input type="checkbox" checked> Remember me</label>
          <a href="#" class="text-decoration-none">Forgot password?</a>
        </div>
        <div class="alert alert-danger py-2" style="font-size:12.5px;display:none;" id="loginError"></div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const errEl = document.getElementById('loginError');
    const btnEl = document.getElementById('loginBtn');
    errEl.style.display = 'none';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      errEl.textContent = 'Please enter both email and password.';
      errEl.style.display = 'block';
      return;
    }

    btnEl.disabled = true;
    btnEl.textContent = 'Signing in...';

    try {
      const res = await window.api.login(email, password);
      if (res && res.success) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        window.location.href = redirect ? decodeURIComponent(redirect) : 'dashboard.html';
      } else {
        errEl.textContent = (res && res.message) ? res.message : 'Invalid email or password.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = err.message || 'Login failed. Please check credentials.';
      errEl.style.display = 'block';
    } finally {
      btnEl.disabled = false;
      btnEl.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
