<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers · Bhimavaram Digitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>body { visibility: hidden !important; }</style>
<script src="assets/js/api.js"></script>
</head>
<body data-page="customers">

<div class="app-shell">
  <div id="sidebar-placeholder"></div>

  <main class="main">
    <div id="topbar-placeholder"></div>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="crumb">Bhimavaram Digitals <span class="breadcrumb-sep">/</span> Customers</div>
          <h1>Customers</h1>
        </div>
        <button class="btn btn-amber" data-bs-toggle="modal" data-bs-target="#customerModal" onclick="openNewCustomer()">
          <i class="bi bi-plus-lg"></i> New Customer
        </button>
      </div>

      <!-- Quick stats -->
      <div class="row g-3 mb-3">
        <div class="col-sm-4"><div class="stat-card"><div class="stat-value" id="statTotalCustomers">0</div><div class="stat-label">Total customers</div></div></div>
        <div class="col-sm-4"><div class="stat-card c-green"><div class="stat-value" id="statActiveCustomers">0</div><div class="stat-label">Active customers</div></div></div>
        <div class="col-sm-4"><div class="stat-card c-blue"><div class="stat-value" id="statInactiveCustomers">0</div><div class="stat-label">Inactive customers</div></div></div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Customer Directory</span>
          <div class="input-group input-group-sm" style="width:250px;">
            <input type="text" class="form-control" placeholder="Search customer..." id="customerSearchInput" onkeyup="if(event.key==='Enter') loadCustomers()">
            <button class="btn btn-outline-secondary" type="button" onclick="loadCustomers()"><i class="bi bi-search"></i></button>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-modern mb-0">
              <thead>
                <tr><th>Customer</th><th>Contact</th><th>City</th><th>Status</th><th class="text-end">Actions</th></tr>
              </thead>
              <tbody id="customerTableBody">
                <tr><td colspan="5" class="text-center py-3 text-muted">Loading customers...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit Customer Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="customerModalTitle">New Customer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="customerForm">
        <input type="hidden" id="cf_id">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Company / Lead Name *</label>
            <input type="text" class="form-control" id="cf_company" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Contact Person *</label>
              <input type="text" class="form-control" id="cf_contact" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Phone *</label>
              <input type="tel" class="form-control" id="cf_phone" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-7 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="cf_email">
            </div>
            <div class="col-md-5 mb-3">
              <label class="form-label">City</label>
              <input type="text" class="form-control" id="cf_city">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Enquiry Source</label>
            <select class="form-select" id="cf_source">
              <option value="Website">Website</option>
              <option value="Referral">Referral</option>
              <option value="Cold Call">Cold Call</option>
              <option value="Walk-in">Walk-in</option>
              <option value="Social Media">Social Media</option>
            </select>
          </div>
          <div class="mb-1">
            <label class="form-label">Notes / Requirement Summary</label>
            <textarea class="form-control" id="cf_notes" rows="3" placeholder="e.g. Interested in billboard advertising near IT corridor"></textarea>
          </div>
          <div class="alert alert-danger py-2 mt-3" style="display:none;font-size:12.5px;" id="cf_error"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="cf_submit_btn">Save Customer</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/script.js"></script>
<script>
  let customersList = [];

  async function loadCustomers() {
    const tbody = document.getElementById('customerTableBody');
    const searchVal = document.getElementById('customerSearchInput').value.trim();

    try {
      let url = '/customers.php?limit=100';
      if (searchVal) url += `&search=${encodeURIComponent(searchVal)}`;

      const res = await window.api.get(url);
      if (!res || !res.success) return;

      customersList = res.data || [];

      // Update stat cards
      document.getElementById('statTotalCustomers').textContent = res.pagination ? res.pagination.total : customersList.length;
      document.getElementById('statActiveCustomers').textContent = customersList.filter(c => c.status === 'active').length;
      document.getElementById('statInactiveCustomers').textContent = customersList.filter(c => c.status === 'inactive').length;

      if (customersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No customers found.</td></tr>`;
        return;
      }

      tbody.innerHTML = customersList.map(c => {
        const initials = (c.company_name || 'CU').split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
        const badgeClass = c.status === 'active' ? 'st-active' : 'st-inactive';

        return `
          <tr>
            <td class="d-flex align-items-center gap-2">
              <div class="row-avatar">${initials}</div>
              <div>
                <div class="fw-semibold">${c.company_name}</div>
                <div class="text-muted" style="font-size:12px;">Contact: ${c.contact_person}</div>
              </div>
            </td>
            <td>
              ${c.phone || '-'}<br>
              <span class="text-muted" style="font-size:12px;">${c.email || ''}</span>
            </td>
            <td>${c.city || '-'}</td>
            <td><span class="badge-status ${badgeClass}">${c.status}</span></td>
            <td class="text-end">
              <button class="action-icon me-1" title="Edit" onclick="openEditCustomer(${c.id})"><i class="bi bi-pencil"></i></button>
              <button class="action-icon text-danger" title="Delete" onclick="deleteCustomer(${c.id}, '${c.company_name.replace(/'/g, "\\'")}')"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Failed to load customers: ${err.message}</td></tr>`;
    }
  }

  function openNewCustomer() {
    document.getElementById('customerModalTitle').textContent = 'New Customer';
    document.getElementById('cf_id').value = '';
    document.getElementById('customerForm').reset();
    document.getElementById('cf_error').style.display = 'none';
  }

  function openEditCustomer(id) {
    const c = customersList.find(item => item.id === id);
    if (!c) return;

    document.getElementById('customerModalTitle').textContent = 'Edit Customer';
    document.getElementById('cf_id').value = c.id;
    document.getElementById('cf_company').value = c.company_name;
    document.getElementById('cf_contact').value = c.contact_person;
    document.getElementById('cf_phone').value = c.phone || '';
    document.getElementById('cf_email').value = c.email || '';
    document.getElementById('cf_city').value = c.city || '';
    document.getElementById('cf_source').value = c.source || 'Website';
    document.getElementById('cf_notes').value = c.notes || '';
    document.getElementById('cf_error').style.display = 'none';

    new bootstrap.Modal(document.getElementById('customerModal')).show();
  }

  async function deleteCustomer(id, name) {
    if (!confirmAction(`Are you sure you want to delete customer "${name}"?`)) return;

    try {
      const res = await window.api.delete(`/customers.php?id=${id}`);
      if (res && res.success) {
        loadCustomers();
      }
    } catch (err) {
      alert(`Delete failed: ${err.message}`);
    }
  }

  document.getElementById('customerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const id = document.getElementById('cf_id').value;
    const errEl = document.getElementById('cf_error');
    const submitBtn = document.getElementById('cf_submit_btn');

    errEl.style.display = 'none';

    const payload = {
      company_name: document.getElementById('cf_company').value.trim(),
      contact_person: document.getElementById('cf_contact').value.trim(),
      phone: document.getElementById('cf_phone').value.trim(),
      email: document.getElementById('cf_email').value.trim(),
      city: document.getElementById('cf_city').value.trim(),
      source: document.getElementById('cf_source').value,
      notes: document.getElementById('cf_notes').value.trim()
    };

    submitBtn.disabled = true;

    try {
      let res;
      if (id) {
        res = await window.api.put(`/customers.php?id=${id}`, payload);
      } else {
        res = await window.api.post('/customers.php', payload);
      }

      if (res && res.success) {
        const modalEl = document.getElementById('customerModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
        loadCustomers();
      } else {
        errEl.textContent = (res && res.message) ? res.message : 'Save customer failed.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = err.message || 'Error saving customer.';
      errEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.addEventListener('DOMContentLoaded', loadCustomers);
</script>
</body>
</html>
