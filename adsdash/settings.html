<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · Bhimavaram Digitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="settings">

<div class="app-shell">
  <div id="sidebar-placeholder"></div>

  <main class="main">
    <div id="topbar-placeholder"></div>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="crumb">Bhimavaram Digitals <span class="breadcrumb-sep">/</span> Settings</div>
          <h1>Settings</h1>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-3">
          <div class="card">
            <div class="card-body p-2">
              <button class="nav-link active w-100 text-start d-flex align-items-center gap-2 mb-1" style="background:var(--bg);color:var(--text);border-radius:8px;padding:10px 12px;" onclick="showTab('company',this)"><i class="bi bi-building"></i> Company Profile</button>
              <button class="nav-link w-100 text-start d-flex align-items-center gap-2 mb-1" style="color:var(--text);border-radius:8px;padding:10px 12px;" onclick="showTab('quote',this)"><i class="bi bi-file-earmark-text"></i> Quotation & Invoice</button>
              <button class="nav-link w-100 text-start d-flex align-items-center gap-2 mb-1" style="color:var(--text);border-radius:8px;padding:10px 12px;" onclick="showTab('tax',this)"><i class="bi bi-percent"></i> Tax & Currency</button>
              <button class="nav-link w-100 text-start d-flex align-items-center gap-2" style="color:var(--text);border-radius:8px;padding:10px 12px;" onclick="showTab('notif',this)"><i class="bi bi-bell"></i> Notifications</button>
            </div>
          </div>
        </div>

        <div class="col-lg-9">
          <!-- BACKEND NOTE: GET/POST api/settings.php — each tab maps to a settings group -->

          <div class="card settings-tab" id="tab-company">
            <div class="card-header">Company Profile</div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Company Name</label><input type="text" class="form-control" value="Ad Screening Co. Pvt. Ltd."></div>
                <div class="col-md-6 mb-3"><label class="form-label">GSTIN</label><input type="text" class="form-control" value="36AACCA1234B1Z5"></div>
              </div>
              <div class="mb-3"><label class="form-label">Registered Address</label><textarea class="form-control" rows="2">4th Floor, Cyber Towers, Hitec City, Hyderabad, Telangana 500081</textarea></div>
              <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Support Email</label><input type="email" class="form-control" value="accounts@adscreening.co.in"></div>
                <div class="col-md-6 mb-3"><label class="form-label">Support Phone</label><input type="tel" class="form-control" value="+91 40 4567 8900"></div>
              </div>
              <div class="mb-1"><label class="form-label">Company Logo (used on PDF quotations & invoices)</label><input type="file" class="form-control"></div>
            </div>
          </div>

          <div class="card settings-tab" id="tab-quote" style="display:none;">
            <div class="card-header">Quotation & Invoice Settings</div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Quotation Number Prefix</label><input type="text" class="form-control" value="QT-"></div>
                <div class="col-md-6 mb-3"><label class="form-label">Invoice Number Prefix</label><input type="text" class="form-control" value="INV-"></div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Quotation Validity (days)</label><input type="number" class="form-control" value="15"></div>
                <div class="col-md-6 mb-3"><label class="form-label">Default Payment Due (days)</label><input type="number" class="form-control" value="15"></div>
              </div>
              <div class="mb-1"><label class="form-label">Default Terms & Conditions (printed on PDF)</label><textarea class="form-control" rows="4">1. Prices are exclusive of GST unless stated.
2. 50% advance required to confirm booking.
3. Cancellations within 7 days of go-live are non-refundable.</textarea></div>
            </div>
          </div>

          <div class="card settings-tab" id="tab-tax" style="display:none;">
            <div class="card-header">Tax & Currency</div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Default GST Rate (%)</label><input type="number" class="form-control" value="18"></div>
                <div class="col-md-6 mb-3"><label class="form-label">Currency</label>
                  <select class="form-select"><option>INR (₹)</option><option>USD ($)</option></select>
                </div>
              </div>
              <div class="mb-1"><label class="form-label">Bank Details (printed on invoice for payment)</label><textarea class="form-control" rows="3">A/c Name: Ad Screening Co. Pvt. Ltd.
Bank: HDFC Bank, Hitec City Branch
A/c No: 5020XXXXXXXX · IFSC: HDFC0001234</textarea></div>
            </div>
          </div>

          <div class="card settings-tab" id="tab-notif" style="display:none;">
            <div class="card-header">Notifications</div>
            <div class="card-body">
              <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Email me when a quotation is approved or rejected</label></div>
              <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Email me 3 days before an invoice is due</label></div>
              <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox"><label class="form-check-label">Daily summary of new customer enquiries</label></div>
              <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Screen booking conflict alerts</label></div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-primary px-4"><i class="bi bi-check-lg"></i> Save Changes</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/script.js"></script>
<script>
  function showTab(key, btn) {
    document.querySelectorAll('.settings-tab').forEach(el => el.style.display = 'none');
    document.getElementById('tab-' + key).style.display = 'block';
    btn.parentElement.querySelectorAll('.nav-link').forEach(b => { b.style.background='transparent'; b.classList.remove('active'); });
    btn.style.background = 'var(--bg)';
    btn.classList.add('active');
  }
</script>
</body>
</html>
