<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management · Bhimavaram Digitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>body { visibility: hidden; }</style>
<script src="assets/js/api.js"></script>
</head>
<body data-page="users">

<div class="app-shell">
  <div id="sidebar-placeholder"></div>

  <main class="main">
    <div id="topbar-placeholder"></div>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="crumb">Bhimavaram Digitals <span class="breadcrumb-sep">/</span> User Management</div>
          <h1>User Management</h1>
        </div>
        <button class="btn btn-amber owner-only" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openNewUser()"><i class="bi bi-plus-lg"></i> Add User</button>
      </div>

      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Team Members</span>
          <div class="d-flex gap-2 align-items-center">
            <select class="form-select form-select-sm" id="filterRole" style="width:auto;" onchange="loadUsers()">
              <option value="">All Roles</option>
              <option value="owner">Owner</option>
              <option value="manager">Manager</option>
              <option value="staff">Staff</option>
            </select>
            <div class="input-group input-group-sm" style="width:200px;">
              <input type="text" class="form-control" placeholder="Search user..." id="userSearchInput" onkeyup="if(event.key==='Enter') loadUsers()">
              <button class="btn btn-outline-secondary" type="button" onclick="loadUsers()"><i class="bi bi-search"></i></button>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-modern mb-0">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Last Login</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="userTableBody">
                <tr><td colspan="7" class="text-center py-4 text-muted">Loading team members...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Roles & Permissions</div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-modern mb-0">
              <thead><tr><th>Role</th><th>Customers</th><th>Quotations</th><th>Invoices</th><th>Payments</th><th>Campaigns</th><th>User Mgmt</th></tr></thead>
              <tbody>
                <tr><td class="fw-semibold">Owner</td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td></tr>
                <tr><td class="fw-semibold">Manager</td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-eye text-muted"></i></td></tr>
                <tr><td class="fw-semibold">Staff</td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-check-circle-fill text-success"></i></td><td><i class="bi bi-x-circle text-muted"></i></td></tr>
              </tbody>
            </table>
          </div>
          <div class="text-muted mt-2" style="font-size:12px;"><i class="bi bi-check-circle-fill text-success"></i> Full access &nbsp; <i class="bi bi-eye"></i> View only &nbsp; <i class="bi bi-x-circle"></i> No access</div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit User Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalTitle">Add User</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="userForm">
        <input type="hidden" id="uf_id">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="uf_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address *</label>
            <input type="email" class="form-control" id="uf_email" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Role *</label>
              <select class="form-select" id="uf_role" required>
                <option value="staff">Staff</option>
                <option value="manager">Manager</option>
                <option value="owner">Owner</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Status *</label>
              <select class="form-select" id="uf_status" required>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="uf_phone" placeholder="e.g. +91 98765 43210">
          </div>
          <div class="mb-1" id="uf_password_wrap">
            <label class="form-label">Password * (min 8 chars)</label>
            <input type="password" class="form-control" id="uf_password">
          </div>
          <div class="alert alert-danger py-2 mt-3" style="display:none;font-size:12.5px;" id="uf_error"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="uf_submit_btn">Save User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/script.js"></script>
<script>
  let usersList = [];

  async function loadUsers() {
    const tbody = document.getElementById('userTableBody');
    const role = document.getElementById('filterRole').value;
    const search = document.getElementById('userSearchInput').value.trim();

    try {
      let params = new URLSearchParams({ limit: 100 });
      if (role) params.append('role', role);
      if (search) params.append('search', search);

      const res = await window.api.get(`/auth.php?action=users&${params.toString()}`);
      if (!res || !res.success) return;

      usersList = res.data || [];

      if (usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = usersList.map(u => {
        const initials = (u.name || 'US').split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
        const badgeClass = u.status === 'active' ? 'st-active' : 'st-rejected';

        return `
          <tr>
            <td class="d-flex align-items-center gap-2">
              <div class="row-avatar">${initials}</div>
              <div class="fw-semibold">${u.name}</div>
            </td>
            <td>${u.email}</td>
            <td><span class="chip text-capitalize"><i class="bi bi-shield-lock me-1"></i> ${u.role}</span></td>
            <td>${u.phone || '-'}</td>
            <td>${u.last_login_at || 'Never'}</td>
            <td><span class="badge-status ${badgeClass}">${u.status}</span></td>
            <td class="text-end">
              <button class="action-icon me-1 manager-only" title="Edit" onclick="openEditUser(${u.id})"><i class="bi bi-pencil"></i></button>
            </td>
          </tr>
        `;
      }).join('');

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">Failed to load users: ${err.message}</td></tr>`;
    }
  }

  function openNewUser() {
    document.getElementById('userModalTitle').textContent = 'Add User';
    document.getElementById('uf_id').value = '';
    document.getElementById('userForm').reset();
    document.getElementById('uf_password_wrap').style.display = 'block';
    document.getElementById('uf_password').required = true;
    document.getElementById('uf_error').style.display = 'none';
  }

  function openEditUser(id) {
    const u = usersList.find(item => item.id === id);
    if (!u) return;

    document.getElementById('userModalTitle').textContent = 'Edit User';
    document.getElementById('uf_id').value = u.id;
    document.getElementById('uf_name').value = u.name;
    document.getElementById('uf_email').value = u.email;
    document.getElementById('uf_role').value = u.role;
    document.getElementById('uf_status').value = u.status;
    document.getElementById('uf_phone').value = u.phone || '';
    document.getElementById('uf_password_wrap').style.display = 'none';
    document.getElementById('uf_password').required = false;
    document.getElementById('uf_error').style.display = 'none';

    new bootstrap.Modal(document.getElementById('userModal')).show();
  }

  document.getElementById('userForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const id = document.getElementById('uf_id').value;
    const errEl = document.getElementById('uf_error');
    const submitBtn = document.getElementById('uf_submit_btn');

    errEl.style.display = 'none';

    submitBtn.disabled = true;

    try {
      let res;
      if (id) {
        const payload = {
          name: document.getElementById('uf_name').value.trim(),
          email: document.getElementById('uf_email').value.trim(),
          role: document.getElementById('uf_role').value,
          status: document.getElementById('uf_status').value,
          phone: document.getElementById('uf_phone').value.trim() || null
        };
        res = await window.api.put(`/auth.php?action=update_user&id=${id}`, payload);
      } else {
        const payload = {
          name: document.getElementById('uf_name').value.trim(),
          email: document.getElementById('uf_email').value.trim(),
          password: document.getElementById('uf_password').value,
          role: document.getElementById('uf_role').value,
          status: document.getElementById('uf_status').value,
          phone: document.getElementById('uf_phone').value.trim() || null
        };
        res = await window.api.post('/auth.php?action=create_user', payload);
      }

      if (res && res.success) {
        const modalEl = document.getElementById('userModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
        loadUsers();
      } else {
        errEl.textContent = (res && res.message) ? res.message : 'Save user failed.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = err.message || 'Error saving user.';
      errEl.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.addEventListener('DOMContentLoaded', loadUsers);
</script>
</body>
</html>
